services:
  app:
    build:
      context: .
      network: host
    container_name: go-container
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8081}:8080"
    environment:
      - PORT=8080
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin}
      - DATABASE_PATH=/data/repos.db
      - CGO_ENABLED=1
      - GOCACHE=/tmp/gocache
    volumes:
      - .:/app
      - ./data:/data
      - go-pkg-cache:/go/pkg/mod
      - go-build-cache:/tmp/gocache
    command: ["go", "run", "./cmd/server"]

volumes:
  go-pkg-cache:
    driver: local
  go-build-cache:
    driver: local
